name: Run Bot

on:
  schedule:
    - cron: "0 */3 * * *"  # Executa a cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and Push History Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Faz o commit das alterações locais geradas pelo bot primeiro
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update history.json [skip ci]"
          
          # 2. Atualiza com a branch remota (usando rebase com autostash por segurança)
          git pull --rebase --autostash origin main
          
          # 3. Faz o push para o repositório
          git push origin main