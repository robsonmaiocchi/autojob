<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoJob - Dashboard de Vagas</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-body: #0f172a;           /* Slate 900 */
            --card-bg: #1e293b;           /* Slate 800 */
            --text-main: #f8fafc;         
            --text-muted: #94a3b8;        
            --border-color: #334155;      
            --primary-color: #3b82f6;     
            --input-bg: #0f172a;          
        }

        body { 
            background-color: var(--bg-body); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header-bg { 
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); 
            color: white; 
            padding: 2.2rem 0; 
            margin-bottom: 2rem; 
            border-bottom: 1px solid var(--border-color);
        }

        /* Cards de Métricas */
        .stat-card { 
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }
        .stat-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }

        /* Container Principal */
        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            position: relative;
        }

        /* Filtros e Busca */
        .form-control, .form-select, .input-group-text {
            background-color: var(--input-bg) !important;
            border-color: var(--border-color) !important;
            color: var(--text-main) !important;
            font-size: 0.9rem;
        }
        .form-control::placeholder { color: #64748b; }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        /* Tabela Estilizada */
        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: -10px;
        }
        .custom-table thead th {
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 1rem;
        }
        .custom-table tbody tr {
            background-color: #1e293b;
            transition: all 0.2s ease;
        }
        .custom-table tbody tr:hover {
            background-color: #24334a;
            transform: translateY(-1px);
        }
        .custom-table td {
            padding: 1rem;
            vertical-align: middle;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .custom-table td:first-child {
            border-left: 1px solid var(--border-color);
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }
        .custom-table td:last-child {
            border-right: 1px solid var(--border-color);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* Badges e Pílulas */
        .pill-badge {
            border-radius: 50rem;
            padding: 0.35em 0.8em;
            font-size: 0.78rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .badge-high { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-medium { background-color: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-low { background-color: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.2); }

        .platform-gupy { background-color: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }
        .platform-linkedin { background-color: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
        .platform-solides { background-color: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
        .platform-remotar { background-color: rgba(20, 184, 166, 0.15); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.3); }
        .platform-coodesh { background-color: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }

        /* Textos e Células */
        .vaga-title-container {
            position: relative;
            cursor: pointer;
        }
        .vaga-title {
            color: #f1f5f9;
            font-size: 0.93rem;
            font-weight: 600;
            line-height: 1.35;
        }
        .vaga-company {
            color: #cbd5e1;
            font-size: 0.88rem;
            font-weight: 500;
        }

        /* Painel Flutuante (Hover Card) */
        .hover-card {
            position: absolute;
            z-index: 1050;
            width: 320px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            display: none;
            pointer-events: none; /* Evita interferir com o movimento do mouse */
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .hover-card.show {
            display: block;
            opacity: 1;
        }

        /* Botões de Ação */
        .btn-action-group .btn {
            padding: 0.35rem 0.65rem;
            font-size: 0.82rem;
            border-radius: 6px;
            font-weight: 500;
        }
        .btn-outline-secondary { color: #94a3b8; border-color: #475569; }
        .btn-outline-secondary:hover { background-color: #334155; color: #f8fafc; }
        .btn-outline-danger { color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
        .btn-outline-danger:hover { background-color: #dc2626; color: white; }
        .btn-outline-success { color: #4ade80; border-color: rgba(34, 197, 94, 0.4); }
        .btn-outline-success:hover { background-color: #16a34a; color: white; }
    </style>
</head>
<body>

    <div class="header-bg">
        <div class="container text-center">
            <h2 class="fw-bold mb-1">🚀 AutoJob Dashboard</h2>
            <p class="text-white-50 mb-0 small">Painel Inteligente de Monitoramento e Oportunidades</p>
        </div>
    </div>

    <!-- Hover Card Flutuante NATIVO -->
    <div id="hoverCard" class="hover-card">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span id="hoverCardPlat"></span>
            <span id="hoverCardScore"></span>
        </div>
        <h6 id="hoverCardTitle" class="fw-bold text-light mb-1" style="font-size: 0.95rem;"></h6>
        <div id="hoverCardCompany" class="text-primary small fw-semibold mb-2"></div>
        <hr class="border-secondary my-2">
        <div id="hoverCardDesc" class="text-secondary small" style="font-size: 0.82rem; max-height: 120px; overflow-y: auto; line-height: 1.4;"></div>
    </div>

    <div class="container mb-5">
        <!-- Cards de Métricas -->
        <div class="row g-3 mb-4 align-items-stretch">
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-title">Total Capturado</span>
                    <div id="stat-total" class="stat-value text-primary">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-title">Alta Relevância</span>
                    <div id="stat-high" class="stat-value text-success">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-title">Candidatado</span>
                    <div id="stat-applied" class="stat-value text-info">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-title">Última Atualização</span>
                    <div id="stat-date" class="stat-value text-secondary" style="font-size: 1.1rem; line-height: 1.2;">-</div>
                </div>
            </div>
        </div>

        <!-- Painel Principal de Filtros e Vagas -->
        <div class="main-card">
            <div class="row g-3 mb-4">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text border-end-0" style="border-radius: 8px 0 0 8px;">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-start-0" style="border-radius: 0 8px 8px 0;" placeholder="Buscar cargo ou empresa...">
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="filterScore" class="form-select" style="border-radius: 8px;">
                        <option value="all">🎯 Todas as Relevâncias</option>
                        <option value="high">🔥 Alta Relevância (≥ 70%)</option>
                        <option value="medium">🟡 Média Relevância (40% - 69%)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filterStatus" class="form-select" style="border-radius: 8px;">
                        <option value="all">📋 Todos os Status</option>
                        <option value="pending">⏳ Pendentes</option>
                        <option value="applied">✅ Candidatado</option>
                    </select>
                </div>
            </div>

            <!-- Tabela Estilizada -->
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th style="width: 30%;">Título do Cargo</th>
                            <th style="width: 18%;">Empresa</th>
                            <th style="width: 12%;">Plataforma</th>
                            <th class="text-center" style="width: 12%;">Match Score</th>
                            <th style="width: 13%;">Capturado em</th>
                            <th class="text-center" style="width: 15%;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="vagasTable">
                        <tr><td colspan="6" class="text-center text-muted py-5"><i class="bi bi-arrow-repeat spin"></i> Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let vagasData = [];
        let statusMap = JSON.parse(localStorage.getItem('autojob_status') || '{}');
        const hoverCard = document.getElementById('hoverCard');

        async function loadDashboard() {
            try {
                const res = await fetch('history.json?t=' + new Date().getTime());
                const data = await res.json();
                vagasData = data.detalhes || [];
                
                updateStats(vagasData, data.hashes ? data.hashes.length : 0);
                renderTable(vagasData);
            } catch (err) {
                document.getElementById('vagasTable').innerHTML = '<tr><td colspan="6" class="text-center text-danger py-5"><i class="bi bi-exclamation-triangle"></i> Erro ao carregar o histórico de vagas.</td></tr>';
            }
        }

        function getVagaKey(v) {
            return `${v.titulo}_${v.empresa}_${v.plataforma}`.toLowerCase().replace(/\s+/g, '');
        }

        function updateStats(detalhes, totalHashes) {
            document.getElementById('stat-total').innerText = totalHashes;
            document.getElementById('stat-high').innerText = detalhes.filter(v => (v.score || 0) >= 70).length;
            
            const appliedCount = Object.values(statusMap).filter(s => s === 'applied').length;
            document.getElementById('stat-applied').innerText = appliedCount;
            
            if (detalhes.length > 0 && detalhes[0].data) {
                const parts = detalhes[0].data.split(' ');
                if (parts.length === 2) {
                    document.getElementById('stat-date').innerHTML = `${parts[0]}<br><span style="font-size: 0.85rem; color: #64748b; font-weight: 500;">${parts[1]}</span>`;
                } else {
                    document.getElementById('stat-date').innerText = detalhes[0].data;
                }
            } else {
                document.getElementById('stat-date').innerText = 'N/A';
            }
        }

        function getPlatformBadge(plat) {
            const name = (plat || '').toLowerCase();
            let cssClass = 'badge-low';
            
            if (name.includes('gupy')) cssClass = 'platform-gupy';
            else if (name.includes('linkedin')) cssClass = 'platform-linkedin';
            else if (name.includes('sólides') || name.includes('solides')) cssClass = 'platform-solides';
            else if (name.includes('remotar')) cssClass = 'platform-remotar';
            else if (name.includes('coodesh')) cssClass = 'platform-coodesh';

            return `<span class="pill-badge ${cssClass}">${plat}</span>`;
        }

        function renderTable(vagas) {
            const tbody = document.getElementById('vagasTable');
            tbody.innerHTML = '';

            if (vagas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">Nenhuma vaga encontrada para os filtros aplicados.</td></tr>';
                return;
            }

            vagas.forEach((v, idx) => {
                const key = getVagaKey(v);
                const currentStatus = statusMap[key] || 'pending';

                if (currentStatus === 'dismissed') return;

                const score = v.score || 0;
                let scoreBadge = '<span class="pill-badge badge-low justify-content-center align-items-center"><i class="bi bi-circle me-1" style="font-size: 0.65rem;"></i> ' + score + '%</span>';

                if (score >= 70) {
                    scoreBadge = '<span class="pill-badge badge-high justify-content-center align-items-center"><i class="bi bi-fire me-1"></i> ' + score + '%</span>';
                } else if (score >= 40) {
                    scoreBadge = '<span class="pill-badge badge-medium justify-content-center align-items-center"><i class="bi bi-star me-1"></i> ' + score + '%</span>';
                }

                const isApplied = currentStatus === 'applied';

                const tr = document.createElement('tr');
                if (isApplied) tr.style.opacity = '0.5';

                tr.innerHTML = `
                    <td>
                        <div class="vaga-title-container" data-idx="${idx}">
                            <div class="vaga-title">${v.titulo}</div>
                            ${isApplied ? '<span class="badge bg-info text-dark mt-1" style="font-size:0.7rem;">Candidatado</span>' : ''}
                        </div>
                    </td>
                    <td><span class="vaga-company">${v.empresa}</span></td>
                    <td>${getPlatformBadge(v.plataforma)}</td>
                    <td class="text-center">${scoreBadge}</td>
                    <td class="text-muted small">${v.data || 'N/A'}</td>
                    <td class="text-center">
                        <div class="btn-group btn-action-group" role="group">
                            <a href="${v.link}" target="_blank" class="btn btn-primary" title="Abrir vaga">
                                <i class="bi bi-box-arrow-up-right"></i> Ver
                            </a>
                            <button onclick="toggleStatus('${key}', '${isApplied ? 'pending' : 'applied'}')" 
                                    class="btn ${isApplied ? 'btn-outline-secondary' : 'btn-outline-success'}" 
                                    title="${isApplied ? 'Desfazer candidatura' : 'Marcar como candidatado'}">
                                <i class="bi ${isApplied ? 'bi-arrow-counterclockwise' : 'bi-check-lg'}"></i>
                            </button>
                            <button onclick="dismissVaga('${key}')" class="btn btn-outline-danger" title="Ocultar vaga">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            setupHoverCards(vagas);
        }

        function setupHoverCards(vagas) {
            document.querySelectorAll('.vaga-title-container').forEach(el => {
                el.addEventListener('mouseenter', (e) => {
                    const idx = el.getAttribute('data-idx');
                    const vaga = vagas[idx];
                    if (!vaga) return;

                    document.getElementById('hoverCardTitle').innerText = vaga.titulo;
                    document.getElementById('hoverCardCompany').innerText = vaga.empresa;
                    document.getElementById('hoverCardPlat').innerHTML = getPlatformBadge(vaga.plataforma);

                    const score = vaga.score || 0;
                    let badgeClass = score >= 70 ? 'badge-high' : (score >= 40 ? 'badge-medium' : 'badge-low');
                    document.getElementById('hoverCardScore').innerHTML = `<span class="pill-badge ${badgeClass}">${score}% Match</span>`;

                    const desc = vaga.resumo || vaga.descricao || 'Sem resumo detalhado disponível para esta vaga. Clique em "Ver" para acessar a descrição completa no site original.';
                    document.getElementById('hoverCardDesc').innerText = desc;

                    // Posicionar o card próximo ao mouse
                    hoverCard.style.top = (e.pageY + 15) + 'px';
                    hoverCard.style.left = (e.pageX + 15) + 'px';
                    hoverCard.classList.add('show');
                });

                el.addEventListener('mousemove', (e) => {
                    hoverCard.style.top = (e.pageY + 15) + 'px';
                    hoverCard.style.left = (e.pageX + 15) + 'px';
                });

                el.addEventListener('mouseleave', () => {
                    hoverCard.classList.remove('show');
                });
            });
        }

        function toggleStatus(key, newStatus) {
            statusMap[key] = newStatus;
            localStorage.setItem('autojob_status', JSON.stringify(statusMap));
            updateStats(vagasData, vagasData.length);
            filterData();
        }

        function dismissVaga(key) {
            if (confirm("Ocultar esta vaga da sua lista?")) {
                statusMap[key] = 'dismissed';
                localStorage.setItem('autojob_status', JSON.stringify(statusMap));
                filterData();
            }
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('filterScore').addEventListener('change', filterData);
        document.getElementById('filterStatus').addEventListener('change', filterData);

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const scoreFilter = document.getElementById('filterScore').value;
            const statusFilter = document.getElementById('filterStatus').value;

            const filtered = vagasData.filter(v => {
                const key = getVagaKey(v);
                const currentStatus = statusMap[key] || 'pending';

                if (currentStatus === 'dismissed') return false;

                const matchesSearch = v.titulo.toLowerCase().includes(search) || v.empresa.toLowerCase().includes(search);
                const score = v.score || 0;
                
                let matchesScore = true;
                if (scoreFilter === 'high') matchesScore = score >= 70;
                if (scoreFilter === 'medium') matchesScore = score >= 40 && score < 70;

                let matchesStatus = true;
                if (statusFilter === 'pending') matchesStatus = currentStatus === 'pending';
                if (statusFilter === 'applied') matchesStatus = currentStatus === 'applied';

                return matchesSearch && matchesScore && matchesStatus;
            });

            renderTable(filtered);
        }

        loadDashboard();
    </script>
</body>
</html>
