<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoJob - Dashboard de Vagas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 2rem 0; margin-bottom: 2rem; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); border-radius: 10px; }
        .badge-high { background-color: #28a745; }
        .badge-medium { background-color: #ffc107; color: #212529; }
        .badge-low { background-color: #6c757d; }
    </style>
</head>
<body>

    <div class="header-bg text-center">
        <div class="container">
            <h1 class="fw-bold">🚀 AutoJob Dashboard</h1>
            <p class="lead mb-0">Painel Inteligente de Monitoramento de Vagas</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <h6 class="text-muted">Total de Vagas</h6>
                    <h2 id="stat-total" class="fw-bold text-primary">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <h6 class="text-muted">Alta Relevância</h6>
                    <h2 id="stat-high" class="fw-bold text-success">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <h6 class="text-muted">Média Relevância</h6>
                    <h2 id="stat-medium" class="fw-bold text-warning">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <h6 class="text-muted">Última Atualização</h6>
                    <h6 id="stat-date" class="fw-bold text-secondary mt-2">-</h6>
                </div>
            </div>
        </div>

        <div class="card p-4">
            <div class="row g-3 mb-3">
                <div class="col-md-8">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Buscar por título ou empresa...">
                </div>
                <div class="col-md-4">
                    <select id="filterScore" class="form-select">
                        <option value="all">Todas as relevâncias</option>
                        <option value="high">🔥 Alta Relevância (≥ 70%)</option>
                        <option value="medium">🟡 Média Relevância (40% - 69%)</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Título</th>
                            <th>Empresa</th>
                            <th>Plataforma</th>
                            <th>Match Score</th>
                            <th>Data</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="vagasTable">
                        <tr><td colspan="6" class="text-center text-muted">Carregando histórico...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let vagasData = [];

        async function loadDashboard() {
            try {
                const res = await fetch('history.json?t=' + new Date().getTime());
                const data = await res.json();
                vagasData = data.detalhes || [];
                
                updateStats(vagasData, data.hashes ? data.hashes.length : 0);
                renderTable(vagasData);
            } catch (err) {
                document.getElementById('vagasTable').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Erro ao carregar o histórico de vagas.</td></tr>';
            }
        }

        function updateStats(detalhes, totalHashes) {
            document.getElementById('stat-total').innerText = totalHashes;
            document.getElementById('stat-high').innerText = detalhes.filter(v => (v.score || 0) >= 70).length;
            document.getElementById('stat-medium').innerText = detalhes.filter(v => (v.score || 0) >= 40 && (v.score || 0) < 70).length;
            document.getElementById('stat-date').innerText = detalhes.length > 0 ? detalhes[0].data : 'N/A';
        }

        function renderTable(vagas) {
            const tbody = document.getElementById('vagasTable');
            tbody.innerHTML = '';

            if (vagas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Nenhuma vaga encontrada.</td></tr>';
                return;
            }

            vagas.forEach(v => {
                const score = v.score || 0;
                let badgeClass = 'badge-low';
                if (score >= 70) badgeClass = 'badge-high';
                else if (score >= 40) badgeClass = 'badge-medium';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-semibold">${v.titulo}</td>
                    <td>${v.empresa}</td>
                    <td><span class="badge bg-light text-dark border">${v.plataforma}</span></td>
                    <td><span class="badge ${badgeClass}">${score}%</span></td>
                    <td class="text-muted small">${v.data || 'N/A'}</td>
                    <td><a href="${v.link}" target="_blank" class="btn btn-sm btn-outline-primary">Candidatar-se</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('filterScore').addEventListener('change', filterData);

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const scoreFilter = document.getElementById('filterScore').value;

            const filtered = vagasData.filter(v => {
                const matchesSearch = v.titulo.toLowerCase().includes(search) || v.empresa.toLowerCase().includes(search);
                const score = v.score || 0;
                let matchesScore = true;
                
                if (scoreFilter === 'high') matchesScore = score >= 70;
                if (scoreFilter === 'medium') matchesScore = score >= 40 && score < 70;

                return matchesSearch && matchesScore;
            });

            renderTable(filtered);
        }

        loadDashboard();
    </script>
</body>
</html>
