<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel AutoJob - Configurações & Métricas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 flex justify-center">
  <div class="max-w-3xl w-full bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold mb-6 text-indigo-400 flex items-center gap-2">
      ⚙️ Gerenciador & Dashboard do AutoJob
    </h1>

    <!-- Dashboard Cards -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-700/50 p-4 rounded-lg border border-slate-600 text-center">
        <span class="text-xs text-slate-400 font-semibold block uppercase">Total no Histórico</span>
        <span id="metricTotal" class="text-2xl font-bold text-indigo-400">0</span>
      </div>
      <div class="bg-slate-700/50 p-4 rounded-lg border border-slate-600 text-center">
        <span class="text-xs text-slate-400 font-semibold block uppercase">Últimas Rastreadas</span>
        <span id="metricRecentes" class="text-2xl font-bold text-emerald-400">0</span>
      </div>
      <div class="bg-slate-700/50 p-4 rounded-lg border border-slate-600 text-center">
        <span class="text-xs text-slate-400 font-semibold block uppercase">Plataformas Ativas</span>
        <span id="metricPlataformas" class="text-2xl font-bold text-amber-400">6/6</span>
      </div>
    </div>

    <!-- Token GitHub -->
    <div class="mb-6">
      <label class="block text-sm font-medium mb-2 text-slate-300">GitHub Personal Access Token (PAT):</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <!-- Plataformas -->
    <div class="mb-6">
      <label class="block text-sm font-medium mb-2 text-slate-300">Plataformas Ativas:</label>
      <div class="grid grid-cols-2 gap-4 bg-slate-700 p-3 rounded border border-slate-600">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="platGupy" onchange="atualizarMetricaPlataformas()" class="w-4 h-4 text-indigo-600 rounded" checked>
          <span>Gupy (API/Scraper)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="platSolides" onchange="atualizarMetricaPlataformas()" class="w-4 h-4 text-indigo-600 rounded" checked>
          <span>Sólides (API)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="platLinkedin" onchange="atualizarMetricaPlataformas()" class="w-4 h-4 text-indigo-600 rounded" checked>
          <span>LinkedIn (Scraper)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="platIndeed" onchange="atualizarMetricaPlataformas()" class="w-4 h-4 text-indigo-600 rounded" checked>
          <span>Indeed (Scraper)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="platRemotar" onchange="atualizarMetricaPlataformas()" class="w-4 h-4 text-indigo-600 rounded" checked>
          <span>Remotar (Scraper)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="platCoodesh" onchange="atualizarMetricaPlataformas()" class="w-4 h-4 text-indigo-600 rounded" checked>
          <span>Coodesh (API)</span>
        </label>
      </div>
    </div>

    <!-- Termos de Busca -->
    <div class="mb-6">
      <label class="block text-sm font-medium mb-2 text-slate-300">Termos de Busca (separados por vírgula):</label>
      <textarea id="termosBusca" rows="3" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500"></textarea>
    </div>

    <!-- Locais -->
    <div class="mb-6">
      <label class="block text-sm font-medium mb-2 text-slate-300">Locais / Modalidades (separados por vírgula):</label>
      <input type="text" id="locais" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <!-- Exclusões -->
    <div class="mb-6">
      <label class="block text-sm font-medium mb-2 text-slate-300">Palavras para Excluir do Título:</label>
      <input type="text" id="termosExcluir" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <!-- Botões Principais -->
    <div class="flex gap-4 mb-6">
      <button onclick="carregarConfig()" class="w-1/2 py-2.5 bg-slate-600 hover:bg-slate-500 rounded font-semibold transition">Carregar do GitHub</button>
      <button onclick="salvarConfig()" class="w-1/2 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded font-semibold transition">Salvar no GitHub</button>
    </div>

    <!-- Lista de Vagas Encontradas Recentemente -->
    <div class="mb-6 border-t border-slate-700 pt-6">
      <h2 class="text-lg font-bold text-indigo-300 mb-3">📋 Últimas Vagas Processadas</h2>
      <div id="listaVagas" class="space-y-2 max-h-48 overflow-y-auto pr-2">
        <p class="text-xs text-slate-400 italic">Carregando histórico do repositório...</p>
      </div>
    </div>

    <!-- Disparar Action Manual -->
    <div class="pt-4 border-t border-slate-700 flex justify-between items-center">
      <span class="text-sm text-slate-400">Quer buscar vagas agora?</span>
      <button onclick="dispararVarredura()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded font-semibold text-sm transition flex items-center gap-1">
        🚀 Executar Varredura Agora
      </button>
    </div>

    <div id="status" class="mt-4 text-center font-medium"></div>
  </div>

  <script>
    const REPO = "robsonmaiocchi/autojob";
    const FILE_PATH = "config.json";
    const HISTORY_PATH = "history.json";

    const DEFAULT_CONFIG = {
      termos_busca: [
        "Analista de Suporte Tecnico",
        "Suporte SaaS",
        "Suporte Tecnico",
        "Technical Support Analyst",
        "Analista de Suporte Junior",
        "Analista de Suporte Pleno"
      ],
      locais: [
        "Remoto",
        "Imbituba",
        "Tubarão",
        "Joinville",
        "Curitiba"
      ],
      termos_excluir: [
        "Estágio",
        "Intern",
        "Sênior",
        "Senior",
        "Lead",
        "Coordenador",
        "Gerente",
        "Manager",
        "Especialista"
      ],
      plataformas: { gupy: true, solides: true, linkedin: true, indeed: true, remotar: true, coodesh: true }
    };

    function atualizarMetricaPlataformas() {
      const gupy = document.getElementById("platGupy").checked ? 1 : 0;
      const solides = document.getElementById("platSolides").checked ? 1 : 0;
      const linkedin = document.getElementById("platLinkedin").checked ? 1 : 0;
      const indeed = document.getElementById("platIndeed").checked ? 1 : 0;
      const remotar = document.getElementById("platRemotar").checked ? 1 : 0;
      const coodesh = document.getElementById("platCoodesh").checked ? 1 : 0;
      
      const total = gupy + solides + linkedin + indeed + remotar + coodesh;
      document.getElementById("metricPlataformas").innerText = `${total}/6`;
    }

    function preencherFormulario(config) {
      document.getElementById("termosBusca").value = config.termos_busca.join(", ");
      document.getElementById("locais").value = config.locais.join(", ");
      document.getElementById("termosExcluir").value = (config.termos_excluir || []).join(", ");
      
      const plats = config.plataformas || { gupy: true, solides: true, linkedin: true, indeed: true, remotar: true, coodesh: true };
      document.getElementById("platGupy").checked = plats.gupy !== false;
      document.getElementById("platSolides").checked = plats.solides !== false;
      document.getElementById("platLinkedin").checked = plats.linkedin !== false;
      document.getElementById("platIndeed").checked = plats.indeed !== false;
      document.getElementById("platRemotar").checked = plats.remotar !== false;
      document.getElementById("platCoodesh").checked = plats.coodesh !== false;
      
      atualizarMetricaPlataformas();
    }

    document.addEventListener("DOMContentLoaded", () => {
      preencherFormulario(DEFAULT_CONFIG);

      const savedToken = localStorage.getItem("autojob_pat");
      if (savedToken) {
        document.getElementById("ghToken").value = savedToken;
        carregarConfig();
      }
      carregarHistorico();
    });

    function base64ToUtf8(str) {
      const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = "";
      bytes.forEach(b => binary += String.fromCharCode(b));
      return btoa(binary);
    }

    async function carregarHistorico() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${HISTORY_PATH}`);
        if (!res.ok) return;
        const data = await res.json();
        const jsonText = base64ToUtf8(data.content.replace(/\n/g, ''));
        const historyData = JSON.parse(jsonText);

        let total = 0;
        let detalhes = [];

        if (Array.isArray(historyData)) {
          total = historyData.length;
        } else if (typeof historyData === "object") {
          total = (historyData.ids || historyData.hashes || []).length;
          detalhes = historyData.detalhes || [];
        }

        document.getElementById("metricTotal").innerText = total;
        document.getElementById("metricRecentes").innerText = detalhes.length;

        const container = document.getElementById("listaVagas");
        if (detalhes.length === 0) {
          container.innerHTML = `<p class="text-xs text-slate-400 italic">Nenhuma vaga processada recentemente.</p>`;
          return;
        }

        container.innerHTML = detalhes.map(v => `
          <div class="bg-slate-700/40 p-2.5 rounded border border-slate-600 flex justify-between items-center text-xs">
            <div>
              <span class="font-bold text-indigo-300">[${v.plataforma || 'Vaga'}]</span>
              <span class="text-white ml-1">${v.titulo}</span>
            </div>
            ${v.link ? `<a href="${v.link}" target="_blank" class="text-emerald-400 hover:underline">Abrir 🔗</a>` : ''}
          </div>
        `).join('');

      } catch (err) {
        console.error("Erro ao carregar histórico:", err);
      }
    }

    async function obterShaAtual(token, path) {
      const headers = token ? { "Authorization": `token ${token}` } : {};
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { headers });
      if (res.ok) {
        const data = await res.json();
        return data.sha;
      }
      return null;
    }

    async function carregarConfig() {
      const status = document.getElementById("status");
      const token = document.getElementById("ghToken").value;
      status.innerText = "Carregando do GitHub...";
      try {
        const headers = token ? { "Authorization": `token ${token}` } : {};
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, { headers });
        if (!res.ok) throw new Error("Não foi possível carregar a configuração.");

        const data = await res.json();
        const contentJson = base64ToUtf8(data.content.replace(/\n/g, ''));
        const content = JSON.parse(contentJson);

        preencherFormulario(content);
        carregarHistorico();

        status.innerText = "✅ Configuração e métricas carregadas com sucesso!";
        status.className = "mt-4 text-center font-medium text-green-400";
      } catch (err) {
        status.innerText = "⚠️ Exibindo valores pré-definidos.";
        status.className = "mt-4 text-center font-medium text-amber-400";
      }
    }

    async function salvarConfig() {
      const token = document.getElementById("ghToken").value;
      const status = document.getElementById("status");

      if (!token) {
        alert("Insira seu GitHub Personal Access Token!");
        return;
      }

      localStorage.setItem("autojob_pat", token);
      status.innerText = "Obtendo SHA e salvando no GitHub...";

      try {
        const currentSha = await obterShaAtual(token, FILE_PATH);
        if (!currentSha) throw new Error("Erro ao obter versão do arquivo.");

        const newConfig = {
          termos_busca: document.getElementById("termosBusca").value.split(",").map(s => s.trim()).filter(Boolean),
          locais: document.getElementById("locais").value.split(",").map(s => s.trim()).filter(Boolean),
          termos_excluir: document.getElementById("termosExcluir").value.split(",").map(s => s.trim()).filter(Boolean),
          plataformas: {
            gupy: document.getElementById("platGupy").checked,
            solides: document.getElementById("platSolides").checked,
            linkedin: document.getElementById("platLinkedin").checked,
            indeed: document.getElementById("platIndeed").checked,
            remotar: document.getElementById("platRemotar").checked,
            coodesh: document.getElementById("platCoodesh").checked
          }
        };

        const jsonString = JSON.stringify(newConfig, null, 2);
        const contentBase64 = utf8ToBase64(jsonString);

        const body = {
          message: "chore: atualiza filtros e plataformas via painel web",
          content: contentBase64,
          sha: currentSha
        };

        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          status.innerText = "🚀 Filtros salvos com sucesso no GitHub!";
          status.className = "mt-4 text-center font-medium text-green-400";
        } else {
          throw new Error(`Erro na API do GitHub (Status: ${res.status}).`);
        }
      } catch (err) {
        status.innerText = `❌ ${err.message}`;
        status.className = "mt-4 text-center font-medium text-red-400";
      }
    }

    async function dispararVarredura() {
      const token = document.getElementById("ghToken").value;
      const status = document.getElementById("status");

      if (!token) {
        alert("Insira seu GitHub Personal Access Token!");
        return;
      }

      status.innerText = "Solicitando execução da varredura...";

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/main.yml/dispatches`, {
          method: "POST",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (res.status === 204) {
          status.innerText = "⚡ Varredura iniciada! Aguarde as notificações no Telegram.";
          status.className = "mt-4 text-center font-medium text-green-400";
        } else {
          throw new Error("Falha ao disparar. Verifique as permissões do Token.");
        }
      } catch (err) {
        status.innerText = `❌ ${err.message}`;
        status.className = "mt-4 text-center font-medium text-red-400";
      }
    }
  </script>
</body>
</html>
