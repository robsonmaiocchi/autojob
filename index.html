<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoJob Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 24px; min-height: 100vh; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header-title h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
        .header-title p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
        .btn-export { background: var(--accent-blue); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-export:hover { opacity: 0.9; }

        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .metric-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .metric-card span { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-card h2 { font-size: 2rem; margin-top: 8px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .chart-card h3 { font-size: 1rem; color: var(--text-muted); margin-bottom: 12px; width: 100%; text-align: left; }

        .filters-bar { background: var(--bg-card); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
        .filters-bar input, .filters-bar select { background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; }
        .filters-bar input { flex: 1; min-width: 200px; }

        .table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
        th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        tr:hover { background: var(--bg-hover); }

        .star-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }
        .star-btn.active { color: var(--accent-yellow); }

        .badge-plat { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); display: inline-block; }
        .badge-score { font-weight: 700; }
        .high-score { color: var(--accent-green); }
        .med-score { color: var(--accent-yellow); }
        .low-score { color: var(--text-muted); }

        .btn-action { padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: 600; border: none; cursor: pointer; }
        .btn-ver { background: var(--accent-blue); color: white; margin-right: 6px; }
        .btn-candidatado { background: var(--bg-hover); color: var(--text-muted); }
        .btn-candidatado.done { background: var(--accent-green); color: white; }

        .title-cell { position: relative; cursor: pointer; }
        .hover-card { display: none; position: absolute; left: 10px; top: 100%; z-index: 100; background: #0f172a; border: 1px solid var(--accent-blue); padding: 12px; border-radius: 8px; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-size: 0.8rem; line-height: 1.4; color: var(--text-main); pointer-events: none; }
        .title-cell:hover .hover-card { display: block; }

        @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>🚀 AutoJob Dashboard</h1>
            <p>Painel Inteligente de Monitoramento e Oportunidades</p>
        </div>
        <button class="btn-export" onclick="exportarCSV()">📥 Exportar CSV</button>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <span>Total Capturado</span>
            <h2 id="metric-total">0</h2>
        </div>
        <div class="metric-card">
            <span>Alta Relevância</span>
            <h2 id="metric-high" style="color: var(--accent-green)">0</h2>
        </div>
        <div class="metric-card">
            <span>Favoritas</span>
            <h2 id="metric-fav" style="color: var(--accent-yellow)">0</h2>
        </div>
        <div class="metric-card">
            <span>Candidatado</span>
            <h2 id="metric-applied" style="color: var(--accent-blue)">0</h2>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <h3>Distribuição por Plataforma</h3>
            <canvas id="chartPlataformas"></canvas>
        </div>
        <div class="chart-card">
            <h3>Nível de Match</h3>
            <canvas id="chartMatch"></canvas>
        </div>
    </div>

    <div class="filters-bar">
        <input type="text" id="filter-search" placeholder="🔍 Buscar cargo ou empresa..." oninput="renderTable()">
        <select id="filter-score" onchange="renderTable()">
            <option value="">🎯 Todas as Relevâncias</option>
            <option value="high">🔥 Alta (>= 70%)</option>
            <option value="medium">🟡 Média (40% - 69%)</option>
            <option value="low">⚪ Geral (< 40%)</option>
        </select>
        <select id="filter-plat" onchange="renderTable()">
            <option value="">🌐 Todas as Plataformas</option>
            <option value="Gupy">Gupy</option>
            <option value="LinkedIn">LinkedIn</option>
            <option value="Sólides">Sólides</option>
            <option value="Remotar">Remotar</option>
            <option value="Coodesh">Coodesh</option>
        </select>
        <select id="filter-status" onchange="renderTable()">
            <option value="">📋 Todos os Status</option>
            <option value="fav">⭐ Apenas Favoritas</option>
            <option value="applied">✅ Apenas Candidatadas</option>
        </select>
        <select id="filter-sort" onchange="renderTable()">
            <option value="date-desc">📅 Mais Recentes</option>
            <option value="score-desc">🔥 Maior Score</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 40px;">★</th>
                    <th>Título do Cargo</th>
                    <th>Empresa</th>
                    <th>Plataforma</th>
                    <th>Match Score</th>
                    <th>Capturado Em</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="vagas-table-body">
                <tr><td colspan="7" style="text-align: center; padding: 20px;">Carregando histórico de vagas...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let rawData = [];
        let favorites = JSON.parse(localStorage.getItem('autojob_favorites') || '[]');
        let applied = JSON.parse(localStorage.getItem('autojob_applied') || '[]');
        let chartPlatInstance = null;
        let chartMatchInstance = null;

        function getVagaKey(vaga) {
            return `${vaga.titulo}_${vaga.empresa}_${vaga.plataforma}`.toLowerCase();
        }

        async function loadHistory() {
            try {
                const res = await fetch('history.json');
                const data = await res.json();
                rawData = data.detalhes || [];
                updateDashboard();
            } catch (e) {
                console.error("Erro ao carregar dados:", e);
                document.getElementById('vagas-table-body').innerHTML = 
                    `<tr><td colspan="7" style="text-align: center; color: var(--accent-red); padding: 20px;">Erro ao carregar history.json. Execute o scraper para gerar o histórico.</td></tr>`;
            }
        }

        function updateDashboard() {
            updateMetrics();
            renderCharts();
            renderTable();
        }

        function updateMetrics() {
            document.getElementById('metric-total').innerText = rawData.length;
            document.getElementById('metric-high').innerText = rawData.filter(v => (v.score || 0) >= 70).length;
            document.getElementById('metric-fav').innerText = favorites.length;
            document.getElementById('metric-applied').innerText = applied.length;
        }

        function toggleFavorite(key) {
            if (favorites.includes(key)) {
                favorites = favorites.filter(k => k !== key);
            } else {
                favorites.push(key);
            }
            localStorage.setItem('autojob_favorites', JSON.stringify(favorites));
            updateDashboard();
        }

        function toggleApplied(key) {
            if (applied.includes(key)) {
                applied = applied.filter(k => k !== key);
            } else {
                applied.push(key);
            }
            localStorage.setItem('autojob_applied', JSON.stringify(applied));
            updateDashboard();
        }

        function renderCharts() {
            const platCounts = {};
            let high = 0, med = 0, low = 0;

            rawData.forEach(v => {
                platCounts[v.plataforma] = (platCounts[v.plataforma] || 0) + 1;
                const score = v.score || 0;
                if (score >= 70) high++;
                else if (score >= 40) med++;
                else low++;
            });

            if (chartPlatInstance) chartPlatInstance.destroy();
            chartPlatInstance = new Chart(document.getElementById('chartPlataformas'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(platCounts),
                    datasets: [{
                        data: Object.values(platCounts),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#f8fafc' } } } }
            });

            if (chartMatchInstance) chartMatchInstance.destroy();
            chartMatchInstance = new Chart(document.getElementById('chartMatch'), {
                type: 'bar',
                data: {
                    labels: ['🔥 Alta (>=70%)', '🟡 Média (40-69%)', '⚪ Geral (<40%)'],
                    datasets: [{
                        data: [high, med, low],
                        backgroundColor: ['#10b981', '#f59e0b', '#94a3b8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#f8fafc' } },
                        y: { ticks: { color: '#f8fafc' } }
                    }
                }
            });
        }

        function renderTable() {
            const search = document.getElementById('filter-search').value.toLowerCase();
            const scoreFilter = document.getElementById('filter-score').value;
            const platFilter = document.getElementById('filter-plat').value;
            const statusFilter = document.getElementById('filter-status').value;
            const sortFilter = document.getElementById('filter-sort').value;

            let filtered = rawData.filter(v => {
                const key = getVagaKey(v);
                const matchText = (v.titulo + ' ' + v.empresa).toLowerCase().includes(search);
                
                let matchScore = true;
                const score = v.score || 0;
                if (scoreFilter === 'high') matchScore = score >= 70;
                if (scoreFilter === 'medium') matchScore = score >= 40 && score < 70;
                if (scoreFilter === 'low') matchScore = score < 40;

                let matchPlat = platFilter ? v.plataforma === platFilter : true;

                let matchStatus = true;
                if (statusFilter === 'fav') matchStatus = favorites.includes(key);
                if (statusFilter === 'applied') matchStatus = applied.includes(key);

                return matchText && matchScore && matchPlat && matchStatus;
            });

            if (sortFilter === 'score-desc') {
                filtered.sort((a, b) => (b.score || 0) - (a.score || 0));
            } else {
                filtered.sort((a, b) => new Date(b.data || 0) - new Date(a.data || 0));
            }

            const tbody = document.getElementById('vagas-table-body');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 20px; color: var(--text-muted);">Nenhuma vaga encontrada para os filtros selecionados.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(v => {
                const key = getVagaKey(v);
                const isFav = favorites.includes(key);
                const isApplied = applied.includes(key);
                const score = v.score || 0;
                
                let scoreClass = 'low-score';
                if (score >= 70) scoreClass = 'high-score';
                else if (score >= 40) scoreClass = 'med-score';

                const resumoText = v.resumo || `Oportunidade para ${v.titulo} na empresa ${v.empresa}.`;

                return `
                    <tr>
                        <td>
                            <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${key}')">★</button>
                        </td>
                        <td class="title-cell">
                            <strong>${v.titulo}</strong>
                            <div class="hover-card">
                                <strong>${v.titulo}</strong><br>
                                <small style="color: var(--accent-blue)">${v.empresa} (${v.plataforma})</small>
                                <p style="margin-top: 6px;">${resumoText}</p>
                            </div>
                        </td>
                        <td>${v.empresa}</td>
                        <td><span class="badge-plat">${v.plataforma}</span></td>
                        <td><span class="badge-score ${scoreClass}">${score}%</span></td>
                        <td><small style="color: var(--text-muted);">${v.data || 'N/A'}</small></td>
                        <td>
                            <a href="${v.link}" target="_blank" class="btn-action btn-ver">🚀 Ver Vaga</a>
                            <button class="btn-action btn-candidatado ${isApplied ? 'done' : ''}" onclick="toggleApplied('${key}')">
                                ${isApplied ? '✓ Candidatado' : 'Marcar'}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function exportarCSV() {
            if (!rawData.length) return alert('Sem dados para exportar!');
            let csv = 'Titulo,Empresa,Plataforma,Score,Data,Link\n';
            rawData.forEach(v => {
                csv += `"${v.titulo}","${v.empresa}","${v.plataforma}",${v.score || 0},"${v.data || ''}","${v.link}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `autojob_vagas_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        loadHistory();
    </script>
</body>
</html>
